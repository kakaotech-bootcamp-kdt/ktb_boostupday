<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KTB BOOST UP DAY</title>

<style>

body {
    margin: 0;
    height: 100vh;
    overflow: hidden; 

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: #0054A5;
    text-align: center;
    font-family: 'Arial Black', 'Trebuchet MS', sans-serif;

    text-shadow:
        2px 2px 8px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.6);
}

/* 배경 */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image: url('Group 4.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    filter: blur(0px);
    transform: scale(1.1);

    z-index: -2;
}

/* 밝은 오버레이 */
body::after {
    content: "";
    position: fixed;
    inset: 0;

    background: rgba(255, 255, 255, 0.15);

    z-index: -1;
}

.title {
    font-size: 4rem;
    font-weight: bold;
    color: #0054A5;
    line-height: 1.1;
}

.title:last-of-type {
    margin-bottom: 50px;
}

#countdown {
    font-size: 7rem;
    font-weight: bold;
    color: #0054A5;
}

@media (max-width: 768px) {

    .title {
        font-size: 2.5rem;
    }

    #countdown {
        font-size: 3rem;
    }

}

</style>
</head>

<body>

<div class="title">KTB BOOST UP DAY</div>
<div class="title">BOOSTER TALK</div>

<div id="countdown">00:00:00</div>

<script>

/*
 * BOOSTER TALK 진행 시간
 *
 * 1부 : 16:30 ~ 17:20
 * 2부 : 17:40 ~ 18:30
 *
 * 현재 시간 기준으로
 * - 시작 전 → 다음 부 시작까지 카운트다운
 * - 진행 중 → "1부" 또는 "2부"
 * - 종료 후 → 종료 메시지
 */

const firstPartStart = { hour: 16, minute: 30 };
const firstPartEnd   = { hour: 17, minute: 20 };

const secondPartStart = { hour: 17, minute: 40 };
const secondPartEnd   = { hour: 18, minute: 30 };


function updateCountdown() {

    const now = new Date();

    // 오늘 날짜 기준으로 각 시간 생성
    const firstStart = new Date(now);
    firstStart.setHours(
        firstPartStart.hour,
        firstPartStart.minute,
        0,
        0
    );

    const firstEnd = new Date(now);
    firstEnd.setHours(
        firstPartEnd.hour,
        firstPartEnd.minute,
        0,
        0
    );

    const secondStart = new Date(now);
    secondStart.setHours(
        secondPartStart.hour,
        secondPartStart.minute,
        0,
        0
    );

    const secondEnd = new Date(now);
    secondEnd.setHours(
        secondPartEnd.hour,
        secondPartEnd.minute,
        0,
        0
    );


    /*
     * 1부 시작 전
     * → 1부 시작까지 카운트다운
     */
    if (now < firstStart) {

        const diff = firstStart - now;

        document.getElementById("countdown").innerText =
            formatTime(diff);

        return;
    }


    /*
     * 1부 진행 중
     */
    if (now >= firstStart && now < firstEnd) {

        document.getElementById("countdown").innerText =
            "1부";

        return;
    }


    /*
     * 1부 종료 ~ 2부 시작 전
     * → 2부 시작까지 카운트다운
     */
    if (now >= firstEnd && now < secondStart) {

        const diff = secondStart - now;

        document.getElementById("countdown").innerText =
            formatTime(diff);

        return;
    }


    /*
     * 2부 진행 중
     */
    if (now >= secondStart && now < secondEnd) {

        document.getElementById("countdown").innerText =
            "2부";

        return;
    }


    /*
     * 2부 종료
     */
    document.getElementById("countdown").innerText =
        "BOOSTER TALK 종료";
}


/*
 * 밀리초를
 * HH:MM:SS 형태로 변환
 */
function formatTime(diff) {

    const totalSeconds = Math.floor(diff / 1000);

    const hours = Math.floor(totalSeconds / 3600);

    const minutes = Math.floor(
        (totalSeconds % 3600) / 60
    );

    const seconds = totalSeconds % 60;

    return `${String(hours).padStart(2, '0')}:` +
           `${String(minutes).padStart(2, '0')}:` +
           `${String(seconds).padStart(2, '0')}`;
}


/*
 * 페이지가 열리자마자 실행
 */
updateCountdown();


/*
 * 1초마다 카운트다운 갱신
 */
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
