<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KTB BOOST UP DAY</title>

<style>

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: #0054A5;
    text-align: center;
    font-family: 'Arial Black', 'Trebuchet MS', sans-serif;

    text-shadow:
        2px 2px 8px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.6);
}

/* 배경 */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image: url('Group 4.png');

    /* 이미지 전체가 보이도록 설정 */
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;

    /* 이미지 확대 제거 */
    transform: none;

    /* 이미지 주변 빈 공간은 검정색 */
    background-color: BLACK;

    z-index: -2;
}

/* 밝은 오버레이 */
body::after {
    content: "";
    position: fixed;
    inset: 0;

    background: rgba(255, 255, 255, 0.15);

    z-index: -1;
}

/* 제목 */
.title {
    font-size: 5rem;
    font-weight: bold;
    color: #0054A5;
    line-height: 1.1;
}

.title:last-of-type {
    margin-bottom: 50px;
}

/* 카운트다운 */
#countdown {
    font-size: 8rem;
    font-weight: bold;
    color: #0054A5;
}

</style>
</head>

<body>

<div class="title">KTB BOOST UP DAY</div>
<div class="title">BOOSTER TALK</div>

<div id="countdown">00:00:00</div>

<script>

/*
 * ==========================================
 * BOOSTER TALK 일정
 * ==========================================
 *
 * 1부 : 22:30 ~ 23:20
 * 2부 : 23:40 ~ 00:30
 *
 * 날짜는 사용하지 않고
 * 현재 시간만 기준으로 동작합니다.
 *
 */


/* 1부 */
const firstPartStart = {
    hour: 22,
    minute: 30
};

const firstPartEnd = {
    hour: 23,
    minute: 20
};


/* 2부 */
const secondPartStart = {
    hour: 23,
    minute: 40
};

const secondPartEnd = {
    hour: 0,
    minute: 30
};


/*
 * 현재 시간을 분 단위로 변환
 */
function getCurrentMinutes() {

    const now = new Date();

    return (
        now.getHours() * 60 +
        now.getMinutes()
    );
}


/*
 * 시간을 분 단위로 변환
 */
function getMinutes(hour, minute) {

    return hour * 60 + minute;
}


/*
 * 카운트다운 표시
 */
function formatTime(totalSeconds) {

    const hours = Math.floor(
        totalSeconds / 3600
    );

    const minutes = Math.floor(
        (totalSeconds % 3600) / 60
    );

    const seconds = totalSeconds % 60;


    return `${String(hours).padStart(2, '0')}:` +
           `${String(minutes).padStart(2, '0')}:` +
           `${String(seconds).padStart(2, '0')}`;
}


/*
 * 카운트다운 업데이트
 */
function updateCountdown() {

    const now = new Date();

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();

    const currentSeconds =
        now.getSeconds();


    const firstStart =
        getMinutes(
            firstPartStart.hour,
            firstPartStart.minute
        );

    const firstEnd =
        getMinutes(
            firstPartEnd.hour,
            firstPartEnd.minute
        );

    const secondStart =
        getMinutes(
            secondPartStart.hour,
            secondPartStart.minute
        );

    const secondEnd =
        getMinutes(
            secondPartEnd.hour,
            secondPartEnd.minute
        );


    /*
     * 1부 시작 전
     */
    if (currentMinutes < firstStart) {

        const diffSeconds =
            (firstStart - currentMinutes) * 60
            - currentSeconds;

        document.getElementById("countdown").innerText =
            formatTime(diffSeconds);

        return;
    }


    /*
     * 1부 진행 중
     */
    if (
        currentMinutes >= firstStart &&
        currentMinutes < firstEnd
    ) {

        document.getElementById("countdown").innerText =
            "1부";

        return;
    }


    /*
     * 1부 종료 ~ 2부 시작 전
     */
    if (
        currentMinutes >= firstEnd &&
        currentMinutes < secondStart
    ) {

        const diffSeconds =
            (secondStart - currentMinutes) * 60
            - currentSeconds;

        document.getElementById("countdown").innerText =
            formatTime(diffSeconds);

        return;
    }


    /*
     * 2부 진행 중
     */
    if (
        currentMinutes >= secondStart ||
        currentMinutes < secondEnd
    ) {

        document.getElementById("countdown").innerText =
            "2부";

        return;
    }


    /*
     * 그 외 시간
     */
    document.getElementById("countdown").innerText =
        "00:00:00";
}


/*
 * 페이지가 열리자마자 실행
 */
updateCountdown();


/*
 * 1초마다 업데이트
 */
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
