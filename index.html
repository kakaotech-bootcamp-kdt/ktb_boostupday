<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KTB BOOST UP DAY</title>

<style>

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: #0054A5;
    text-align: center;
    font-family: 'Arial Black', 'Trebuchet MS', sans-serif;

    text-shadow:
        2px 2px 8px rgba(255,255,255,0.8),
        0 0 20px rgba(255,255,255,0.6);
}

/* 배경 */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image: url('Group 4.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    filter: blur(0px);
    transform: scale(1.1);

    z-index: -2;
}

/* 밝은 오버레이 */
body::after {
    content: "";
    position: fixed;
    inset: 0;

    background: rgba(255, 255, 255, 0.15);

    z-index: -1;
}

/* 제목 */
.title {
    font-size: 4rem;
    font-weight: bold;
    color: #0054A5;
    line-height: 1.1;
}

.title:last-of-type {
    margin-bottom: 50px;
}

/* 카운트다운 */
#countdown {
    font-size: 7rem;
    font-weight: bold;
    color: #0054A5;
}

/* 모바일 */
@media (max-width: 768px) {

    .title {
        font-size: 2.5rem;
    }

    #countdown {
        font-size: 3rem;
    }

}

</style>
</head>

<body>

<div class="title">KTB BOOST UP DAY</div>
<div class="title">BOOSTER TALK</div>

<div id="countdown">D-0 00:00:00</div>

<script>

/*
 * ==========================================
 * BOOSTER TALK 일정
 * ==========================================
 *
 * 행사일 : 2026년 9월 11일
 *
 * 1부 : 16:30 ~ 17:20
 * 2부 : 17:40 ~ 18:30
 *
 */

// 나중에 여기 시간을 수정하기*********
/* 행사 날짜 */
const eventDate = "2026-09-11";


/* 1부 */
const firstPartStart = new Date(
    `${eventDate}T16:30:00`
);

const firstPartEnd = new Date(
    `${eventDate}T17:20:00`
);


/* 2부 */
const secondPartStart = new Date(
    `${eventDate}T17:40:00`
);

const secondPartEnd = new Date(
    `${eventDate}T18:30:00`
);


/*
 * 카운트다운 업데이트
 */
function updateCountdown() {

    const now = new Date();


    /*
     * ==========================================
     * 행사일 이전
     * ==========================================
     *
     * 1부 시작까지 남은 시간을 표시
     *
     * 예:
     * D-1 19:30:00
     * D-0 01:30:00
     *
     */
    if (now < firstPartStart) {

        const diff = firstPartStart - now;

        document.getElementById("countdown").innerText =
            formatCountdown(diff);

        return;
    }


    /*
     * ==========================================
     * 1부 진행 중
     * ==========================================
     */
    if (
        now >= firstPartStart &&
        now < firstPartEnd
    ) {

        document.getElementById("countdown").innerText =
            "1부";

        return;
    }


    /*
     * ==========================================
     * 1부 종료 ~ 2부 시작 전
     * ==========================================
     *
     * 2부 시작까지 카운트다운
     */
    if (
        now >= firstPartEnd &&
        now < secondPartStart
    ) {

        const diff = secondPartStart - now;

        document.getElementById("countdown").innerText =
            formatCountdown(diff);

        return;
    }


    /*
     * ==========================================
     * 2부 진행 중
     * ==========================================
     */
    if (
        now >= secondPartStart &&
        now < secondPartEnd
    ) {

        document.getElementById("countdown").innerText =
            "2부";

        return;
    }


    /*
     * ==========================================
     * 행사 종료
     * ==========================================
     */
    if (now >= secondPartEnd) {

        document.getElementById("countdown").innerText =
            "BOOSTER TALK 종료";

        return;
    }

}


/*
 * ==========================================
 * 카운트다운 시간 변환
 * ==========================================
 *
 * D-일수 HH:MM:SS
 *
 */
function formatCountdown(diff) {

    const totalSeconds = Math.floor(diff / 1000);


    /* 남은 일수 */
    const days = Math.floor(
        totalSeconds / (24 * 60 * 60)
    );


    /* 남은 시간 */
    const hours = Math.floor(
        (totalSeconds % (24 * 60 * 60)) / 3600
    );


    /* 남은 분 */
    const minutes = Math.floor(
        (totalSeconds % 3600) / 60
    );


    /* 남은 초 */
    const seconds = totalSeconds % 60;


    return `D-${days} ` +
           `${String(hours).padStart(2, '0')}:` +
           `${String(minutes).padStart(2, '0')}:` +
           `${String(seconds).padStart(2, '0')}`;
}


/*
 * 페이지가 열리자마자 실행
 */
updateCountdown();


/*
 * 1초마다 업데이트
 */
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
